.tag { font-size: 11.5px; font-weight: 700; }
@keyframes glow { 0%,55%,100% { opacity: 1; } 70% { opacity: .35; } }
@keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
.glow { animation: glow 3.2s ease-in-out infinite; }
.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
