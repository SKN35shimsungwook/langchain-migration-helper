<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="검증 루프 효과 읽는 법 (예시 숫자)">
<style>
text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #18202B; }
.t { font-size: 22px; font-weight: 700; }
.v { font-size: 20px; font-weight: 700; }
.s { font-size: 14px; fill: #4A5565; }
.tag { font-size: 12.5px; font-weight: 700; fill: #8A4B12; }
@keyframes g1 { 0%,30% { transform: scaleY(1); } 34%,40% { transform: scaleY(0); } 52%,100% { transform: scaleY(1); } }
@keyframes g2 { 0%,30% { transform: scaleY(1); } 34%,54% { transform: scaleY(0); } 66%,100% { transform: scaleY(1); } }
@keyframes g3 { 0%,30% { transform: scaleY(1); } 34%,68% { transform: scaleY(0); } 80%,100% { transform: scaleY(1); } }
@keyframes show { 0%,30% { opacity: 1; } 34%,80% { opacity: 0; } 88%,100% { opacity: 1; } }
.b1 { transform-origin: 0 300px; animation: g1 9s ease-out infinite; }
.b2 { transform-origin: 0 300px; animation: g2 9s ease-out infinite; }
.b3 { transform-origin: 0 300px; animation: g3 9s ease-out infinite; }
.gain { animation: show 9s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .b1,.b2,.b3,.gain { animation: none; } }
</style>
<rect width="800" height="360" rx="16" fill="#F7F8FA"/>
<text x="28" y="40" class="t">검증 루프 효과 읽는 법</text>
<rect x="300" y="22" width="92" height="24" rx="12" fill="#FBEBD8"/><text x="346" y="39" class="tag" text-anchor="middle">예시 숫자</text>

<!-- 축: 0%=y300, 100%=y80 (2.2px/%) -->
<path d="M70 300 H520" stroke="#C3C2B7" stroke-width="1.5"/>
<g class="s"><text x="62" y="304" text-anchor="end">0%</text><text x="62" y="194" text-anchor="end">50%</text><text x="62" y="84" text-anchor="end">100%</text></g>
<path d="M70 190 H520 M70 80 H520" stroke="#E1E0D9" stroke-width="1"/>

<!-- 막대: 20% 57% 90% -->
<rect class="b1" x="110" y="256" width="90" height="44" rx="4" fill="#2457C5"/>
<rect class="b2" x="250" y="174.6" width="90" height="125.4" rx="4" fill="#2457C5"/>
<rect class="b3" x="390" y="102" width="90" height="198" rx="4" fill="#2457C5"/>
<text x="155" y="248" class="v" text-anchor="middle">20%</text>
<text x="295" y="166" class="v" text-anchor="middle">57%</text>
<text x="435" y="94" class="v" text-anchor="middle">90%</text>
<g class="s" text-anchor="middle"><text x="155" y="324">1회차</text><text x="295" y="324">2회차까지</text><text x="435" y="324">3회차까지</text></g>

<!-- baseline -->
<path d="M70 218.6 H520" stroke="#B8501F" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="516" y="212" class="s" text-anchor="end" style="fill:#B8501F;font-weight:700">일반 AI 37%</text>

<!-- 설명 -->
<g class="gain">
  <path d="M500 102 H520 V256 H500" stroke="#1B7A43" stroke-width="2.5" fill="none"/>
  <text x="534" y="170" class="v" style="fill:#1B7A43">+70%p</text>
  <text x="534" y="194" class="s">= 90 − 20</text>
</g>
<text x="534" y="244" class="s">1회차: 처음 한 번에 맞힌 비율</text>
<text x="534" y="266" class="s">최종: 다시 고치기까지 해서 맞힌 비율</text>
<text x="534" y="288" class="s">%p: 퍼센트끼리 뺀 값</text>
</svg>
