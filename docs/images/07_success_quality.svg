<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="성공의 질 네 가지">
<style>
text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #18202B; }
.t { font-size: 22px; font-weight: 700; }
.h { font-size: 15px; font-weight: 700; }
.s { font-size: 12.5px; fill: #4A5565; }
@keyframes swing { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.sign { transform-origin: 270px 92px; animation: swing 2.4s ease-in-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .sign,.blink { animation: none; } }
</style>
<rect width="800" height="260" rx="16" fill="#F7F8FA"/>
<text x="28" y="40" class="t">통과했다고 다 같은 성공은 아니에요</text>

<!-- 1 깔끔한 성공 -->
<rect x="24" y="60" width="176" height="180" rx="12" fill="#E1F3E8"/>
<rect x="60" y="80" width="104" height="58" rx="6" fill="#FFFFFF" stroke="#1B7A43" stroke-width="2"/>
<path d="M90 110 l10 10 l22 -22" stroke="#1B7A43" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="112" y="170" class="h" text-anchor="middle" style="fill:#1B7A43">깔끔한 성공</text>
<text x="112" y="192" class="s" text-anchor="middle">새 서랍에서</text>
<text x="112" y="208" class="s" text-anchor="middle">새 도구를 꺼냄</text>

<!-- 2 community -->
<rect x="216" y="60" width="176" height="180" rx="12" fill="#FFF4DB"/>
<path d="M252 92 H288" stroke="#8A6A55" stroke-width="2"/>
<g class="sign">
  <rect x="238" y="96" width="64" height="30" rx="4" fill="#FFFFFF" stroke="#8A4B12" stroke-width="2"/>
  <text x="270" y="116" class="s" text-anchor="middle" style="fill:#8A4B12;font-weight:700">곧 폐점</text>
</g>
<rect x="244" y="128" width="120" height="16" fill="#E8C98A"/>
<text x="304" y="170" class="h" text-anchor="middle" style="fill:#8A4B12">community 경고</text>
<text x="304" y="192" class="s" text-anchor="middle">"곧 문 닫는 가게"</text>
<text x="304" y="208" class="s" text-anchor="middle">지금은 되지만 곧 못 씀</text>

<!-- 3 classic -->
<rect x="408" y="60" width="176" height="180" rx="12" fill="#ECECEC"/>
<rect x="444" y="84" width="104" height="56" rx="4" fill="#C9B79C" stroke="#7A6A55" stroke-width="2"/>
<path d="M444 102 H548" stroke="#7A6A55" stroke-width="2"/>
<text x="496" y="126" class="s" text-anchor="middle" style="fill:#3E3426;font-weight:700">창고</text>
<text x="496" y="170" class="h" text-anchor="middle" style="fill:#4A4A4A">classic 의존</text>
<text x="496" y="192" class="s" text-anchor="middle">창고의 낡은 도구</text>
<text x="496" y="208" class="s" text-anchor="middle">되지만 요즘 방식 아님</text>

<!-- 4 실패 -->
<rect x="600" y="60" width="176" height="180" rx="12" fill="#FBE4E2"/>
<rect x="636" y="80" width="104" height="58" rx="6" fill="#FFFFFF" stroke="#B42F2A" stroke-width="2" stroke-dasharray="6 4"/>
<path class="blink" d="M672 96 l32 30 M704 96 l-32 30" stroke="#B42F2A" stroke-width="5" stroke-linecap="round"/>
<text x="688" y="170" class="h" text-anchor="middle" style="fill:#B42F2A">실패</text>
<text x="688" y="192" class="s" text-anchor="middle">서랍을 열었는데</text>
<text x="688" y="208" class="s" text-anchor="middle">도구가 없음</text>
</svg>
