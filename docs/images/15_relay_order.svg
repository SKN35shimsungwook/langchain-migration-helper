<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="팀 일 순서: 1번 뼈대와 2번 데이터가 먼저, 3번 변환 검증이 다음, 4번은 기다리는 동안 준비하고 마지막에 연결과 평가">
<style>
text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #18202B; }
.t { font-size: 22px; font-weight: 700; }
.h { font-size: 15px; font-weight: 700; }
.lane { font-size: 12.5px; font-weight: 700; }
.c { font-size: 12.5px; fill: #FFFFFF; font-weight: 700; }
.d { font-size: 12.5px; }
.s { font-size: 12px; fill: #4A5565; }
.num { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
@keyframes run { 0% { transform: translateX(0); } 100% { transform: translateX(560px); } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.baton { animation: run 8s linear infinite; }
.blink { animation: blink 2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .baton,.blink { animation: none; } }
</style>
<rect width="800" height="440" rx="16" fill="#F7F8FA"/>
<text x="28" y="40" class="t">팀 일 순서 (이어달리기)</text>
<text x="290" y="40" class="s">앞 사람이 바통을 넘겨야 다음 사람이 본격적으로 달린다</text>

<!-- 시간 축 -->
<text x="170" y="74" class="s">1단계 · 뼈대와 재료</text>
<text x="380" y="74" class="s">2단계 · 요리</text>
<text x="560" y="74" class="s">3단계 · 연결과 채점</text>
<path d="M150 82 H780" stroke="#C9D2DD" stroke-width="1.5"/>
<path d="M360 82 V400 M540 82 V400" stroke="#DCE1E7" stroke-width="1.5" stroke-dasharray="4 4"/>

<!-- 1번 -->
<circle cx="44" cy="118" r="14" fill="#5B6B80"/><text x="44" y="123" class="num" text-anchor="middle">1</text>
<text x="62" y="123" class="lane">그래프 · 백엔드</text>
<rect x="160" y="104" width="190" height="30" rx="8" fill="#5B6B80"/><text x="172" y="124" class="c">State · 그래프 틀 · 폴더</text>
<rect x="370" y="104" width="400" height="30" rx="8" fill="#AEB8C5"/><text x="382" y="124" class="c" style="fill:#18202B">단계 연결 · 다시 시도 판단 · 화면이 부를 입구</text>

<!-- 2번 -->
<circle cx="44" cy="178" r="14" fill="#5B6B80"/><text x="44" y="183" class="num" text-anchor="middle">2</text>
<text x="62" y="183" class="lane">데이터 · 검색</text>
<rect x="160" y="164" width="190" height="30" rx="8" fill="#5B6B80"/><text x="172" y="184" class="c">문서 모으기 · 벡터 DB</text>
<rect x="370" y="164" width="160" height="30" rx="8" fill="#AEB8C5"/><text x="382" y="184" class="c" style="fill:#18202B">검색기 · 이사 목록</text>

<!-- 3번 -->
<circle cx="44" cy="238" r="14" fill="#5B6B80"/><text x="44" y="243" class="num" text-anchor="middle">3</text>
<text x="62" y="243" class="lane">변환 · 검증</text>
<rect x="160" y="224" width="190" height="30" rx="8" fill="#DCE1E7"/><text x="172" y="244" class="d">설계 · 프롬프트 준비</text>
<rect x="370" y="224" width="400" height="30" rx="8" fill="#5B6B80"/><text x="382" y="244" class="c">코드 고치기 · 실행해서 검증 · 결과 정리</text>

<!-- 4번 -->
<circle cx="44" cy="318" r="14" fill="#2457C5"/><text x="44" y="323" class="num" text-anchor="middle">4</text>
<text x="62" y="323" class="lane" style="fill:#2457C5">화면 · 평가</text><text x="30" y="350" class="s" style="fill:#2457C5;font-weight:700">(나)</text>
<rect x="160" y="298" width="370" height="40" rx="8" fill="#E4ECFB" stroke="#2457C5" stroke-dasharray="5 4"/>
<text x="172" y="316" class="d">기다리는 동안: 평가 규칙 · 시험지 · 일반 AI 실험 ·</text>
<text x="172" y="332" class="d">화면 틀(가짜 데이터) · 1~3번에게 필요한 것 묻기</text>
<rect x="550" y="298" width="220" height="40" rx="8" fill="#2457C5"/>
<text x="562" y="316" class="c">화면 연결 · 우리 프로그램 실험</text>
<text x="562" y="332" class="c">그래프 · 보고서 · 발표</text>

<!-- 바통 -->
<g class="baton"><circle cx="170" cy="370" r="9" fill="#E0A100"/></g>
<path d="M160 370 H770" stroke="#E0A100" stroke-width="2" stroke-dasharray="2 6"/>
<text x="160" y="400" class="s">바통 = 결과물</text>
<text x="300" y="400" class="s">State · 벡터 DB →</text>
<text x="452" y="400" class="s">변환 결과(report) →</text>
<text x="640" y="400" class="s" font-weight="700">숫자 · 발표</text>
<g class="blink"><rect x="548" y="294" width="224" height="48" rx="10" fill="none" stroke="#E0A100" stroke-width="2"/></g>
</svg>
