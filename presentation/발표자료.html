</section></div><figcaption>2 / 13</figcaption><details class="notes"><summary>발표자 노트</summary><p>수업 중에 강사님도 말씀하셨듯이, LangChain을 LLM에게 물어보면 복잡한 질문일수록 구버전 코드를 줍니다. 왼쪽 코드는 실제로 LangChain 1.4.4 환경에서 실행한 결과입니다. 첫 줄부터 에러가 납니다. 더 큰 문제는 LLM이 이게 틀렸다는 걸 모른다는 점입니다. [가능하면 ChatGPT에게 실제로 물어본 답변 캡처로 왼쪽 코드를 교체]</p></details></figure>

</section></div><figcaption>3 / 13</figcaption><details class="notes"><summary>발표자 노트</summary><p>이 현상을 &#x27;버전 지체 환각&#x27;이라고 부르겠습니다. 연구 결과도 같은 이야기를 합니다. 문서가 부족하면 LLM이 만든 코드 중 약 43%만 실행되고, 문서를 줘도 66% 정도에 머뭅니다. 즉 문서만 주는 것으로는 부족하고, 실제로 실행해서 확인하는 단계가 필요하다는 뜻입니다. 이게 저희 프로젝트의 출발점입니다. (출처: arXiv 2604.09515, arXiv 2507.12367)</p></details></figure>
