<aside>코드를 모르는 분도 이해하기 쉽게 주방으로 비유해 보겠습니다. LangChain은 주방 도구 세트이고, import는 "어느 서랍에서 어떤 도구를 꺼내라"는 뜻입니다. 1.0에서 주방을 새로 정리하면서 ChatOpenAI는 새 서랍으로 이사 갔고, LLMChain은 창고로 치워졌고, initialize_agent는 없어졌습니다. 그런데 AI는 옛날 주방만 기억해서 옛날 서랍을 열라고 알려 줍니다. 그래서 에러가 납니다.</aside>
